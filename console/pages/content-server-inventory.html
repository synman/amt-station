<div class="col gap16" id="inventory-page" data-server="@@KEY@@">
  <div class="banner error" id="inv-paused" hidden role="status"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-block"/></svg><span class="txt" id="inv-paused-text"></span></div>
  <div class="row" id="inv-bar">
    <span class="spacer"></span>
    <span class="body-s muted" id="inv-note">amt_inventory · not read yet</span>
    <div class="btn-wrap" id="inv-reread-wrap"><button type="button" class="btn text" id="inv-reread"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-refresh"/></svg>Re-read</button></div>
    <div class="btn-wrap" id="inv-export-wrap"><button type="button" class="btn text" id="inv-export"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-download"/></svg>Export JSON</button></div>
  </div>
  <div class="col gap8" id="inv-state" aria-live="polite"></div>
  <div class="banner" id="inv-banner" hidden role="status"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-info"/></svg><span class="txt" id="inv-banner-text"></span></div>
  <div class="grid" id="inv-cards"></div>
  <p class="body-s muted m0" id="inv-call"></p>
</div>
