<div class="col gap16" id="logs-page" data-server="@@KEY@@">
  <div class="banner error" id="logs-paused" hidden role="status"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-block"/></svg><span class="txt" id="logs-paused-text"></span></div>
  <div class="row filters">
    <div class="seg" role="group" aria-label="Log"><button type="button" id="log-event" data-kind="event" aria-pressed="true">Event log</button><button type="button" id="log-audit" data-kind="audit" aria-pressed="false">Audit log</button></div>
    <div class="field win"><label for="since">Since (UTC)</label><input id="since" class="mono" placeholder="no lower bound, e.g. 2026-10-19T00:00:00Z" autocomplete="off" spellcheck="false"><span class="help">ISO-8601; no zone means UTC</span></div>
    <div class="field win"><label for="until">Until (UTC)</label><input id="until" class="mono" placeholder="no upper bound" autocomplete="off" spellcheck="false"><span class="help">ISO-8601; no zone means UTC</span></div>
    <div class="seg" role="group" aria-label="Severity" id="sev-seg"><button type="button" data-sev="all" aria-pressed="true">all</button><button type="button" data-sev="warning" aria-pressed="false">warning+</button><button type="button" data-sev="critical" aria-pressed="false">critical</button></div>
    <div class="btn-wrap" id="log-read-wrap"><button type="button" class="btn tonal" id="log-read"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-refresh"/></svg>Read</button></div>
  </div>
  <div class="card" id="log-card" aria-labelledby="log-h">
    <h2 id="log-h"><svg class="i" aria-hidden="true"><use href="/static/icons.svg#i-list"/></svg><span id="log-title">Event log</span></h2>
    <div class="col gap8" id="log-state" aria-live="polite"></div>
    <div id="log-table"></div>
    <div class="row">
      <span class="body-s muted" id="log-counts"></span>
      <span class="spacer"></span>
      <div class="btn-wrap" id="log-newer-wrap"><button type="button" class="btn text" id="log-newer">Newer</button></div>
      <div class="btn-wrap" id="log-older-wrap"><button type="button" class="btn text" id="log-older">Older</button></div>
    </div>
    <p class="body-s muted m0" id="log-sevnote" hidden></p>
    <p class="body-s muted m0" id="log-call"></p>
    <p class="body-s muted m0">amt_logs {device, kind, since, until, offset, limit 1–500} · read-only · audit records are decoded big-endian (verified live 2026-10-18), raw codes and hex stay beside every row · each page is a fresh read of the whole log</p>
  </div>
</div>
